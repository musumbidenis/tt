# Cloudflare deploys the database Worker from this file on every push to GitHub (Workers Builds).
# Only worker/worker.js is deployed; the website itself stays on GitHub Pages.
# Secrets (ADMIN_PIN, BRIDGE_SECRET, VAPID_PRIVATE_KEY, VAPID_SUBJECT) and the plain variable
# VAPID_PUBLIC_KEY are kept in the Cloudflare dashboard and are not touched by a deploy
# (that is what keep_vars below is for). See the README.
name = "rvnp-attendance"
main = "worker/worker.js"
compatibility_date = "2025-09-01"
keep_vars = true            # keep any plain variables set in the dashboard

[placement]
mode = "smart"              # run next to the database (README step 8)

[[d1_databases]]
binding = "DB"
database_name = "rvnp-attendance"
database_id = "44a79960-ce61-4cc0-afeb-d915fcbe0ecf"

# Optional KV cache that cuts D1 reads to a minimum (see the README, "Keeping D1 reads low").
# The Worker runs fine without it — every cached read falls back to D1 — so this stays commented until
# the namespace exists. To turn it on:
#   1. Create the namespace once:  npx wrangler kv namespace create CACHE
#      (or Cloudflare dashboard -> Storage & Databases -> KV -> Create namespace, name it "CACHE").
#   2. Paste the namespace id below and uncomment these three lines.
#   3. Push (Workers Builds redeploys) or run:  npx wrangler deploy
# [[kv_namespaces]]
# binding = "CACHE"
# id = "PASTE_THE_KV_NAMESPACE_ID_HERE"

# Only college Google accounts may connect (staff) or own evidence files (students). Not a secret.
[vars]
GOOGLE_DOMAIN = "rvnp.ac.ke"
# The app's Google sign-in ID (not a secret; the same as googleClientId in config.js). The secret GOOGLE_CLIENT_SECRET is set in Cloudflare.
GOOGLE_CLIENT_ID = "945611933983-grt6lrqgnovsbe52rec7bd9tdmt8j1rp.apps.googleusercontent.com"
